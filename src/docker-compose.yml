# ===========================================================================
# Blinko for TerraMaster TOS 7 (multi-container Docker application)
# ===========================================================================
# App image : blinkospace/blinko:1.8.7 (Docker Hub)
# Database  : postgres:16-alpine (internal only)
#
# Only the app publishes a host port; PostgreSQL is reachable only on the
# compose network. Every container runs as uid 1000, and the app generates
# its own NEXTAUTH_SECRET on first start instead of hard-coding one.
#
# NOTE for maintainers: never place a comment line directly in front of a
# "- value" sequence item (ports, volumes, ...): the official installer
# parses the compose file line by line and a comment inside a sequence makes
# it skip the ownership sync of the mounted directories.

services:
  blinkodocker:
    image: blinkospace/blinko:1.8.7
    container_name: blinkodocker
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        @@ENTRYPOINT_SH@@
    depends_on:
      blinkodocker-db:
        condition: service_healthy
    ports:
      - "8092:1111"
    environment:
      TZ: "Asia/Shanghai"
      DATABASE_URL: "postgresql://blinko@blinkodocker-db:5432/blinko"
      NEXTAUTH_URL: "http://localhost:8092"
    volumes:
      - /Volume1/DockerAppData/blinkodocker/data:/app/.blinko
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:1111/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  blinkodocker-db:
    image: postgres:16-alpine
    container_name: blinkodocker-db
    restart: unless-stopped
    user: "1000:1000"
    environment:
      TZ: "Asia/Shanghai"
      POSTGRES_USER: "blinko"
      POSTGRES_DB: "blinko"
      POSTGRES_HOST_AUTH_METHOD: "trust"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - /Volume1/DockerAppData/blinkodocker/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blinko -d blinko"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

# TOS App Center web metadata (must be the last block of the file):
# web.port is the published host port above, protocol is http.
x-app-meta:
  web:
    port: 8092
    protocol: http
